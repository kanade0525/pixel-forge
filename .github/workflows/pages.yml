# main への push で Vite ビルドし、GitHub Pages（https://<user>.github.io/pixel-forge/）へ公開する。
# Pages のソースは「GitHub Actions」に設定しておくこと（このワークフローが artifact をデプロイする）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Pages デプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイがあれば新しい方を優先（古いのはキャンセル）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pages 未設定でも初回に自動で有効化（ソース=GitHub Actions）
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
